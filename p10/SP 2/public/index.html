<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Secure User Registration</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="card">
        <h1>Create Secure Account</h1>
        <p class="subtitle">Validated inputs, salted password hashing &amp; safe error handling</p>

        <form id="regForm" novalidate>
            <label for="username">Username</label>
            <input type="text" id="username" placeholder="e.g., dhveet_01" required>

            <label for="email">Email Address</label>
            <input type="email" id="email" placeholder="e.g., dhveet@example.com" required>

            <label for="password">Password</label>
            <input type="password" id="password" placeholder="Create a strong password" required>

            <ul class="rules" id="rulesList">
                <li id="r-len">At least 8 characters</li>
                <li id="r-upper">One uppercase letter (A-Z)</li>
                <li id="r-lower">One lowercase letter (a-z)</li>
                <li id="r-num">One number (0-9)</li>
                <li id="r-spec">One special character (@$!%*?&#)</li>
            </ul>

            <label for="confirmPassword">Confirm Password</label>
            <input type="password" id="confirmPassword" placeholder="Re-enter password" required>

            <button type="submit">Register</button>
        </form>

        <div id="statusBox" class="status" style="display:none;"></div>
    </div>

    <script>
        const passwordInput = document.getElementById("password");
        const statusBox = document.getElementById("statusBox");

        passwordInput.addEventListener("input", () => {
            const val = passwordInput.value;
            document.getElementById("r-len").className = val.length >= 8 ? "valid" : "";
            document.getElementById("r-upper").className = /[A-Z]/.test(val) ? "valid" : "";
            document.getElementById("r-lower").className = /[a-z]/.test(val) ? "valid" : "";
            document.getElementById("r-num").className = /\d/.test(val) ? "valid" : "";
            document.getElementById("r-spec").className = /[@$!%*?&#^()_\-+=]/.test(val) ? "valid" : "";
        });

        function showStatus(message, isError) {
            statusBox.style.display = "block";
            statusBox.textContent = message;
            statusBox.className = isError ? "status error" : "status success";
        }

        document.getElementById("regForm").addEventListener("submit", async (e) => {
            e.preventDefault();
            const username = document.getElementById("username").value.trim();
            const email = document.getElementById("email").value.trim();
            const password = passwordInput.value;
            const confirmPassword = document.getElementById("confirmPassword").value;

            if (password !== confirmPassword) {
                showStatus("Passwords do not match.", true);
                return;
            }

            try {
                const res = await fetch("/api/register", {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({ username, email, password, confirmPassword })
                });
                const data = await res.json();
                showStatus(data.message || data.error, !res.ok);
                if (res.ok) {
                    e.target.reset();
                    document.querySelectorAll("#rulesList li").forEach(li => li.className = "");
                }
            } catch (err) {
                showStatus("Network error: Unable to reach registration server.", true);
            }
        });
    </script>
</body>
</html>
