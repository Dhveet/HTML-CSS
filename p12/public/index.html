<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Library Management System</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body class="bg-light">

  <!-- Navbar -->
  <nav class="navbar navbar-dark bg-dark mb-4">
    <div class="container">
      <a class="navbar-brand fw-bold" href="#">MyLibrary</a>
    </div>
  </nav>

  <!-- Main Content -->
  <div class="container">
    <div class="row g-4">

      <!-- Add Book Form -->
      <div class="col-12 col-md-4">
        <div class="card p-3 shadow-sm">
          <h4 class="mb-3">Add New Book</h4>
          <form id="bookForm">
            <div class="mb-2">
              <label class="form-label">Book Title</label>
              <input type="text" id="title" class="form-control" placeholder="e.g. Clean Code" required>
            </div>
            <div class="mb-2">
              <label class="form-label">Author</label>
              <input type="text" id="author" class="form-control" placeholder="e.g. Robert Martin" required>
            </div>
            <div class="mb-3">
              <label class="form-label">Published Year</label>
              <input type="number" id="year" class="form-control" min="1900" max="2026" placeholder="e.g. 2008" required>
            </div>
            <button type="submit" class="btn btn-primary w-100">Add Book</button>
          </form>
        </div>
      </div>

      <!-- Book List Table -->
      <div class="col-12 col-md-8">
        <div class="card p-3 shadow-sm">
          <h4 class="mb-3">Available Books</h4>
          <div class="table-responsive">
            <table class="table table-bordered table-striped">
              <thead class="table-dark">
                <tr>
                  <th>Title</th>
                  <th>Author</th>
                  <th>Year</th>
                  <th>Action</th>
                </tr>
              </thead>
              <tbody id="bookList">
                <!-- Books will load here via JS -->
              </tbody>
            </table>
          </div>
        </div>
      </div>

    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
