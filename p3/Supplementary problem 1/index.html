<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Result Calculator</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <h1>Student Result Calculator</h1>
        <form id="resultForm">
            <label for="studentName">Student Name:</label>
            <input type="text" id="studentName" placeholder="Enter student name" required>

            <label for="m1">Mathematics (0-100):</label>
            <input type="number" id="m1" min="0" max="100" required>

            <label for="m2">Web Technology (0-100):</label>
            <input type="number" id="m2" min="0" max="100" required>

            <label for="m3">Basic Electrical Engg. (0-100):</label>
            <input type="number" id="m3" min="0" max="100" required>

            <label for="m4">Algorithms (0-100):</label>
            <input type="number" id="m4" min="0" max="100" required>

            <button type="button" onclick="calculateResult()">Calculate Result</button>
        </form>

        <div id="output" class="output-box"></div>
    </div>

    <script src="script.js"></script>
</body>
</html>
