<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>News Headlines Viewer</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <header>
            <h1>Live News Headlines</h1>
            <div class="controls">
                <span id="timerText">Next refresh in: 15s</span>
                <button id="refreshBtn">Refresh Now</button>
            </div>
        </header>

        <p id="status"></p>
        <div id="newsContainer" class="news-grid"></div>
    </div>

    <script src="script.js"></script>
</body>
</html>
