<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Information Management</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <h1>Student Information Management</h1>
        <form id="studentForm">
            <input type="hidden" id="studentId">
            <input type="text" id="name" placeholder="Full Name" required>
            <input type="email" id="email" placeholder="Email Address" required>
            <input type="text" id="course" placeholder="Course (e.g., B.Tech CE)" required>
            <input type="number" id="semester" placeholder="Semester (1-8)" min="1" max="8" required>
            <button type="submit" id="submitBtn">Add Student</button>
        </form>
        <p id="msg"></p>
        <table>
            <thead>
                <tr><th>ID</th><th>Name</th><th>Email</th><th>Course</th><th>Sem</th><th>Actions</th></tr>
            </thead>
            <tbody id="tableBody"></tbody>
        </table>
    </div>

    <script>
        const form = document.getElementById("studentForm");
        const msg = document.getElementById("msg");

        async function loadStudents() {
            const res = await fetch("/api/students");
            const data = await res.json();
            document.getElementById("tableBody").innerHTML = data.map(s => `
                <tr>
                    <td>${s.id}</td><td>${s.name}</td><td>${s.email}</td><td>${s.course}</td><td>${s.semester}</td>
                    <td>
                        <button class="edit" onclick="editStudent(${s.id}, '${s.name}', '${s.email}', '${s.course}', ${s.semester})">Edit</button>
                        <button class="del" onclick="deleteStudent(${s.id})">Delete</button>
                    </td>
                </tr>
            `).join("");
        }

        form.addEventListener("submit", async (e) => {
            e.preventDefault();
            const id = document.getElementById("studentId").value;
            const payload = {
                name: document.getElementById("name").value,
                email: document.getElementById("email").value,
                course: document.getElementById("course").value,
                semester: document.getElementById("semester").value
            };

            const res = await fetch(id ? `/api/students/${id}` : "/api/students", {
                method: id ? "PUT" : "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify(payload)
            });
            const result = await res.json();
            msg.textContent = result.message || result.error;
            if (res.ok) {
                form.reset();
                document.getElementById("studentId").value = "";
                document.getElementById("submitBtn").textContent = "Add Student";
                loadStudents();
            }
        });

        function editStudent(id, name, email, course, semester) {
            document.getElementById("studentId").value = id;
            document.getElementById("name").value = name;
            document.getElementById("email").value = email;
            document.getElementById("course").value = course;
            document.getElementById("semester").value = semester;
            document.getElementById("submitBtn").textContent = "Update Student";
        }

        async function deleteStudent(id) {
            if (!confirm("Are you sure you want to delete this student?")) return;
            const res = await fetch(`/api/students/${id}`, { method: "DELETE" });
            const result = await res.json();
            msg.textContent = result.message || result.error;
            loadStudents();
        }

        loadStudents();
    </script>
</body>
</html>
