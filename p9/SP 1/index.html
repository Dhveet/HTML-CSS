<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Weather Information Portal</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <h1>Weather Information Portal</h1>
        <form id="weatherForm" class="search-bar">
            <input type="text" id="cityInput" placeholder="Enter city (e.g., Nadiad, Delhi)" required>
            <button type="submit">Search</button>
        </form>
        <p id="status" class="status"></p>
        <div id="currentWeather" class="current-box"></div>
        <div id="forecastGrid" class="forecast-grid"></div>
    </div>

    <script src="script.js"></script>
</body>
</html>
