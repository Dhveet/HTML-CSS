<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Book Search Application</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <h1>Book Search Application</h1>
        <form id="bookForm" class="search-bar">
            <input type="text" id="queryInput" placeholder="Search books (e.g., Python, Harry Potter)" required>
            <button type="submit">Search Books</button>
        </form>
        <p id="status" class="status"></p>
        <div id="bookGrid" class="book-grid"></div>
    </div>

    <script src="script.js"></script>
</body>
</html>
