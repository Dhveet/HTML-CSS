<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Movie Information System</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <h1>Movie Information System</h1>
        <form id="movieForm" class="search-bar">
            <input type="text" id="movieInput" placeholder="Search movies/shows (e.g., Batman, Matrix)" required>
            <button type="submit">Search</button>
        </form>
        <p id="status" class="status"></p>
        <div id="movieGrid" class="movie-grid"></div>
    </div>

    <script src="script.js"></script>
</body>
</html>
